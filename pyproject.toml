[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phaseeq"
version = "1.20.20"
description = "PhaseEQ response measurement and FIR correction design application."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
  { name = "Tomii323" },
]
dependencies = [
  "altair>=5",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "optuna>=4.4,<5",
  "pandas>=1.5",
  "plotly>=5.20",
  "pdfplumber>=0.11",
  "scipy>=1.10",
  "sounddevice>=0.5",
  "soundfile>=0.13",
  "streamlit>=1.62,<1.63",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["octave_boundary_smoothing", "list_menu_state", "fir_output_window"]

